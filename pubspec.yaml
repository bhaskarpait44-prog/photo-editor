name: pixel_forge
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  image: ^4.1.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  image_gallery_saver: ^2.0.3
  file_picker: ^8.0.3
  phosphor_flutter: ^2.1.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  flutter_colorpicker: ^1.1.0
  gesture_x_detector: ^1.0.4
  fast_noise: ^2.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
